<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solary</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="Front_java.js" defer></script>
  </head>
  <body>
    <div class="my-box" id="info-box">
      <strong>Solar System Sandbox</strong><br />
      <span id="selected-info">Click a planet to inspect</span>
    </div>

    <div class="button-container">
      <button id="pause-btn" class="ui-btn"><img id="pause_play_btn" src="Pause button.png" style="float:left;margin-right:0.5em"></img>
      </button>
      <button id="reset-btn" class="ui-btn"> <img id="restart_btn_img" src="Reset Button.png" style ="float:left;margin-right:0.5em"></img>
      </button>
      <button id="spawn-btn" class="ui-btn"><img id ="add_planet_img" src="Plus Button.png" style = "float:left;margin-right:0.5em"></img>
        </button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for Click-and-Drag Camera Movement -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </body>
</html>
