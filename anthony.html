<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeRED</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="Front_java.js" defer></script>
  </head>
  <body>
    <div class="my-box" id="info-box">
      <strong>Solar System Sandbox</strong><br />
      <span id="selected-info">Click a planet to inspect</span>
    </div>

    <div class="button-container">
      <button id="pause-btn" class="ui-btn">Pause</button>
      <button id="reset-btn" class="ui-btn">Reset</button>
      <button id="spawn-btn" class="ui-btn">Spawn Planet</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for Click-and-Drag Camera Movement -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </body>
</html>
