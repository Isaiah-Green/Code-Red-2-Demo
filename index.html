<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeRED</title>
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #000; 
      }
      .my-box {
        position: absolute;
        top: 30px;
        left: 30px;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 12px 18px;
        font-family: Arial, sans-serif;
        border-radius: 8px;
        border: 2px solid #ffffff;
        z-index: 10;
        min-width: 180px;
        font-size: 14px;
        line-height: 1.5;
      }
      .button-container {
        position: absolute;
        top: 30px;
        right: 30px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }
      .ui-btn {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        color: white;
        border: 2px solid #ffffff;
        border-radius: 8px;
        font-family: Arial, sans-serif;
      }
      #pause-btn {
        background-color: #333333;
      }
      #pause-btn:hover {
        background-color: #555555;
      }
      #reset-btn {
        background-color: #333333;
      }
      #reset-btn:hover {
        background-color: #555555;
      }
      #spawn-btn {
        background-color: #ff3300;
      }
      #spawn-btn:hover {
        background-color: #ff5522;
      }
    </style>
  </head>
  <body>
    <div class="my-box" id="info-box">
      <strong>Solar System Sandbox</strong><br>
      <span id="selected-info">Click a planet to inspect</span>
    </div>

    <div class="button-container">
      <button id="pause-btn" class="ui-btn">Pause</button>
      <button id="reset-btn" class="ui-btn">Reset</button>
      <button id="spawn-btn" class="ui-btn">Spawn Planet</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for Click-and-Drag Camera Movement -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
      // 1. Scene Setup
      const scene = new THREE.Scene();

      // ---------- Orthographic Camera & Frustum ----------
      const viewSize = 120;
      function frustum() {
        const aspect = window.innerWidth / window.innerHeight;
        return {
          left: (-viewSize * aspect) / 2,
          right: (viewSize * aspect) / 2,
          top: viewSize / 2,
          bottom: -viewSize / 2,
        };
      }
      const f = frustum();
      const camera = new THREE.OrthographicCamera(
        f.left,
        f.right,
        f.top,
        f.bottom,
        0.1,
        1000,
      );
      // Tilted top-down angle so orbits read clearly
      camera.position.set(0, 70, 60);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // ---------- Orbit Controls Setup ----------
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; 
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0, 0); 

      // ---------- Starfield Background ----------
      const starCount = 1500;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * viewSize * 3.4;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * viewSize * 2;
        starPositions[i * 3 + 2] = -(150 + Math.random() * 300);
        const b = 0.35 + Math.random() * 0.65; 
        starColors[i * 3] = starColors[i * 3 + 1] = starColors[i * 3 + 2] = b;
      }
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      starGeometry.setAttribute("color", new THREE.BufferAttribute(starColors, 3));
      const starMaterial = new THREE.PointsMaterial({
        size: 1.6,
        sizeAttenuation: false,
        vertexColors: true,
      });
      const stars = new THREE.Points(starGeometry, starMaterial);
      camera.add(stars);
      scene.add(camera);

      // ---------- Physics & Bodies Setup ----------
      const G = 1.0;
      const SOFTENING = 0.01;
      let bodies = [];
      let userSpawnedMeshes = []; 
      let userSpawnedRings = [];  
      let isPaused = false; 

      // Selection tracking variables
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let selectedBody = null;

      function createBody(mesh, position, velocity, mass, name, isStatic = false, isUserSpawned = false) {
        mesh.position.copy(position);
        scene.add(mesh);
        
        const bodyObj = {
          name: name,
          mesh: mesh,
          position: position.clone(),
          velocity: velocity.clone(),
          acceleration: new THREE.Vector3(0, 0, 0),
          mass: mass,
          isStatic: isStatic,
          isUserSpawned: isUserSpawned
        };

        // Attach physics object reference to mesh for raycasting lookup
        mesh.userData.bodyRef = bodyObj;

        bodies.push(bodyObj);
        if (isUserSpawned) {
          userSpawnedMeshes.push(mesh);
        }
        return bodyObj;
      }

      // Helper to build wireframe sphere and its orbit ring track
      function addPlanetWithOrbit(name, radius, segments, color, distance, mass, initialVelZ) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(radius, segments, segments),
          new THREE.MeshBasicMaterial({ color: color, wireframe: true })
        );
        createBody(mesh, new THREE.Vector3(distance, 0, 0), new THREE.Vector3(0, 0, initialVelZ), mass, name, false, false);

        // Create visual orbit track ring
        const ringGeometry = new THREE.RingGeometry(distance - 0.08, distance + 0.08, 128);
        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
      }

      // --- Create Sun (Static Anchor at Center) ---
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(5, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true })
      );
      createBody(sunMesh, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0), 1000, "Sun", true, false);

      // --- Create Base Planets with Balanced Orbital Velocities ---
      addPlanetWithOrbit("Mercury", 1, 16, 0xaaaaaa, 12, 1, 9.13);  
      addPlanetWithOrbit("Venus", 1.5, 16, 0xe3bb76, 19, 2, 7.25); 
      addPlanetWithOrbit("Earth", 2, 16, 0x2233ff, 28, 3, 5.98);  
      addPlanetWithOrbit("Mars", 1.3, 16, 0xd15226, 36, 1.5, 5.27); 

      // ---------- Spawning Function for User Button ----------
      let spawnCounter = 1;
      function spawnUserPlanet(position) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(1, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
        );

        const sunPos = bodies[0].position;
        const relPos = new THREE.Vector3().subVectors(position, sunPos);
        const distance = relPos.length();
        const orbitalSpeed = Math.sqrt((G * bodies[0].mass) / distance);
        
        const velocity = new THREE.Vector3(-relPos.z, 0, relPos.x)
          .normalize()
          .multiplyScalar(orbitalSpeed)
          .add(bodies[0].velocity);

        const planetName = `Planet ${spawnCounter++}`;
        createBody(mesh, position, velocity, 0.5, planetName, false, true);

        // Optional matching orbit track for spawned planet
        const ringGeometry = new THREE.RingGeometry(distance - 0.08, distance + 0.08, 128);
        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
        userSpawnedRings.push(ring);
      }

      // ---------- Click-to-Inspect Raycasting Listener ----------
      window.addEventListener('click', (event) => {
        // Ignore clicks if clicking on UI buttons
        if (event.target.tagName === 'BUTTON') return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Collect all planet meshes from bodies array
        const planetMeshes = bodies.map(b => b.mesh);
        const intersects = raycaster.intersectObjects(planetMeshes);

        if (intersects.length > 0) {
          // Get the body reference attached to the clicked mesh
          selectedBody = intersects[0].object.userData.bodyRef;
        } else {
          // Clicked empty space clears selection
          selectedBody = null;
          document.getElementById('selected-info').innerHTML = "Click a planet to inspect";
        }
      });

      // ---------- Reset Function ----------
      function resetSimulation() {
        userSpawnedMeshes.forEach(mesh => {
          scene.remove(mesh);
          mesh.geometry.dispose();
          mesh.material.dispose();
        });
        userSpawnedMeshes = [];

        userSpawnedRings.forEach(ring => {
          scene.remove(ring);
          ring.geometry.dispose();
          ring.material.dispose();
        });
        userSpawnedRings = [];

        let i = bodies.length;
        while (i--) {
          if (bodies[i].isUserSpawned) {
            bodies.splice(i, 1);
          }
        }

        selectedBody = null;
        spawnCounter = 1;
        document.getElementById('selected-info').innerHTML = "Click a planet to inspect";
      }

      // Button Event Listeners
      document.getElementById('spawn-btn').addEventListener('click', () => {
        spawnUserPlanet(new THREE.Vector3(44, 0, 0));
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        resetSimulation();
      });

      const pauseBtn = document.getElementById('pause-btn');
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "Play" : "Pause";
      });

      // ---------- Gravity Calculation ----------
      function calculateGravitationalForce(bodyA, bodyB) {
        const direction = new THREE.Vector3().subVectors(bodyB.position, bodyA.position);
        const distanceSq = direction.lengthSq() + (SOFTENING * SOFTENING);
        const distance = Math.sqrt(distanceSq);

        if (distance === 0) return new THREE.Vector3(0, 0, 0);

        const forceMagnitude = (G * bodyA.mass * bodyB.mass) / distanceSq;
        direction.normalize();
        direction.multiplyScalar(forceMagnitude);

        return direction;
      }

      // ---------- Physics Update Loop ----------
      function updatePhysics(deltaTime) {
        bodies.forEach(body => body.acceleration.set(0, 0, 0));

        for (let i = 0; i < bodies.length; i++) {
          for (let j = i + 1; j < bodies.length; j++) {
            const bodyA = bodies[i];
            const bodyB = bodies[j];

            const forceOnA = calculateGravitationalForce(bodyA, bodyB);
            const forceOnB = forceOnA.clone().negate();

            bodyA.acceleration.addScaledVector(forceOnA, 1 / bodyA.mass);
            bodyB.acceleration.addScaledVector(forceOnB, 1 / bodyB.mass);
          }
        }

        bodies.forEach(body => {
          if (body.isStatic) return;

          body.velocity.addScaledVector(body.acceleration, deltaTime);
          body.position.addScaledVector(body.velocity, deltaTime);
          body.mesh.position.copy(body.position);
          body.mesh.rotation.y += 0.02; // Self-rotation
        });
      }

      // ---------- Main Animation Loop ----------
      let lastTime = performance.now();

      function animate(currentTime) {
        requestAnimationFrame(animate);

        const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;

        if (!isPaused) {
          updatePhysics(deltaTime);
          sunMesh.rotation.y += 0.005;
        }

        // Update UI info box if a planet is selected
        if (selectedBody) {
          const speed = selectedBody.velocity.length().toFixed(2);
          const distance = new THREE.Vector3().subVectors(bodies[0].position,selectedBody.position).length().toFixed(2)
          document.getElementById('selected-info').innerHTML = `
            <strong>${selectedBody.name}</strong><br>
            Velocity: ${speed} units/s
            Current Distance From Sun: ${distance * 5342781} Km<br>
          `;
        }

        // Required for OrbitControls damping inertia
        controls.update();

        renderer.render(scene, camera);
      }
      animate(performance.now());

      // ---------- Resize Handling ----------
      window.addEventListener("resize", () => {
        const f = frustum();
        camera.left = f.left;
        camera.right = f.right;
        camera.top = f.top;
        camera.bottom = f.bottom;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    
    </script>
  </body>
</html>
