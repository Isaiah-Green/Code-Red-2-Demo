<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRED</title>
    <style>
        body{margin:0;overflow:hidden}
        .my-box {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 220px;
            height: 120px;
            background-color: rgba(255, 51, 0, 0.8); /* Semi-transparent red-orange */
            border: 2px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            padding: 15px;
            font-family: Arial, sans-serif;
            z-index: 10; /* CRITICAL: Forces this box to sit ON TOP of the 3D canvas */
            pointer-events: auto; /* Allows clicking */
        }
    </style>
</head>
<body>
       <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
       <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
        camera.position.z  = 10
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth,window.innerHeight);
        document.body.appendChild(renderer.domElement);
        //Sun
        const geometry = new THREE.SphereGeometry(1,5,5);
        const material = new THREE.MeshBasicMaterial({color:0xffcc00,wireframe:true});
        const planet = new THREE.Mesh(geometry,material);
        planet.position.x  = 7
        //Mercury
        const geometry_2 = new THREE.SphereGeometry(1,1,1);
        const material_2 = new THREE.MeshBasicMaterial({color:0xaaaaaa,wireframe:true});
        const planet_2 = new THREE.Mesh(geometry,material);
        planet_2.position.x  = 4.5
        //Venus
        const geometry_3 = new THREE.SphereGeometry(1,2,2);
        const material_3 = new THREE.MeshBasicMaterial({color:0xe3bb76,wireframe:true});
        const planet_3 = new THREE.Mesh(geometry,material);
        planet_3.position.x  = 1.5
        //Earth
        const geometry_4 = new THREE.SphereGeometry(1,4,4);
        const material_4 = new THREE.MeshBasicMaterial({color:0x2233ff,wireframe:true});
        const planet_4 = new THREE.Mesh(geometry,material);
        planet_4.position.x = -2
        //Mars
        const geometry_5 = new THREE.SphereGeometry(1,3,3);
        const material_5 = new THREE.MeshBasicMaterial({color:0xf4e2bb,wireframe:true});
        const planet_5 = new THREE.Mesh(geometry,material);
        planet_5.position.x = -6
        scene.add(planet)
        scene.add(planet_2)
        scene.add(planet_3)
        scene.add(planet_4)
        scene.add(planet_5)
        function animate(){
            requestAnimationFrame(animate);
            planet.rotation.y += 0.04;
            planet_2.rotation.y += 0.02;
            planet_3.rotation.y -= 0.004;
            planet_4.rotation.y += 1.0;
            planet_5.rotation.y += 0.97;
            renderer.render(scene,camera);
        }
        animate();
       </script>

</body>
</html>
