<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRED</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        .my-box {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 220px;
            height: 120px;
            background-color: rgba(255, 51, 0, 0.8);
            border: 2px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            padding: 15px;
            font-family: Arial, sans-serif;
            z-index: 10;
            pointer-events: auto;
        }
        #spawn-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            padding: 12px 20px;
            font-size: 16px;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="spawn-btn">Spawn Planet</button>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 10, 50);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Physics & Bodies Setup
        const G = 1.0;
        const SOFTENING = 0.5;
        const bodies = [];

        // Helper function to create celestial bodies
        function createBody(mesh, position, velocity, mass, isStatic = false) {
            mesh.position.copy(position);
            scene.add(mesh);
            bodies.push({
                mesh: mesh,
                position: position.clone(),
                velocity: velocity.clone(),
                acceleration: new THREE.Vector3(0, 0, 0),
                mass: mass,
                isStatic: isStatic
            });
        }

        // --- Create Sun & Planets ---
        // Sun (Static Anchor)
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true })
        );
        createBody(sunMesh, new THREE.Vector3(15, 0, 0), new THREE.Vector3(0, 0, 0), 1000, true);

        // Mercury
        const mercMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xaaaaaa, wireframe: true })
        );
        createBody(mercMesh, new THREE.Vector3(22, 0, 0), new THREE.Vector3(0, 0, 6.7), 1);

        // Venus
        const venusMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xe3bb76, wireframe: true })
        );
        createBody(venusMesh, new THREE.Vector3(25, 0, 0), new THREE.Vector3(0, 0, 6.3), 2);

        // Earth
        const earthMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x2233ff, wireframe: true })
        );
        createBody(earthMesh, new THREE.Vector3(30, 0, 0), new THREE.Vector3(0, 0, 5.7), 3);

        // 3. Spawning Function for User Button
        function spawnUserPlanet(position) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(1, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true })
            );

            // Calculate stable initial velocity vector relative to the Sun
            const sunPos = bodies[0].position;
            const relPos = new THREE.Vector3().subVectors(position, sunPos);
            const distance = relPos.length();
            const orbitalSpeed = Math.sqrt((G * bodies[0].mass) / distance);
            
            const velocity = new THREE.Vector3(-relPos.z, 0, relPos.x)
                .normalize()
                .multiplyScalar(orbitalSpeed)
                .add(bodies[0].velocity);

            createBody(mesh, position, velocity, 0.5, false);
        }

        // Button Click Event Listener
        document.getElementById('spawn-btn').addEventListener('click', () => {
            // Spawn a new planet further out on the X axis
            spawnUserPlanet(new THREE.Vector3(40, 0, 0));
        });

        // 4. Gravity Calculation
        function calculateGravitationalForce(bodyA, bodyB) {
            const direction = new THREE.Vector3().subVectors(bodyB.position, bodyA.position);
            const distanceSq = direction.lengthSq() + (SOFTENING * SOFTENING);
            const distance = Math.sqrt(distanceSq);

            if (distance === 0) return new THREE.Vector3(0, 0, 0);

            const forceMagnitude = (G * bodyA.mass * bodyB.mass) / distanceSq;
            direction.normalize();
            direction.multiplyScalar(forceMagnitude);

            return direction;
        }

        // 5. Physics Update Loop
        function updatePhysics(deltaTime) {
            // Reset accelerations
            bodies.forEach(body => body.acceleration.set(0, 0, 0));

            // Pairwise gravity calculation (O(N^2))
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const bodyA = bodies[i];
                    const bodyB = bodies[j];

                    const forceOnA = calculateGravitationalForce(bodyA, bodyB);
                    const forceOnB = forceOnA.clone().negate();

                    bodyA.acceleration.addScaledVector(forceOnA, 1 / bodyA.mass);
                    bodyB.acceleration.addScaledVector(forceOnB, 1 / bodyB.mass);
                }
            }

            // Update positions & velocities
            bodies.forEach(body => {
                if (body.isStatic) return;

                body.velocity.addScaledVector(body.acceleration, deltaTime);
                body.position.addScaledVector(body.velocity, deltaTime);
                body.mesh.position.copy(body.position);
            });
        }

        // 6. Main Animation Loop
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            // Run your physics engine
            updatePhysics(deltaTime);

            // Optional self-rotation for aesthetics
            sunMesh.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        // Kick off the loop
        animate(performance.now());
    </script>
</body>
</html>
